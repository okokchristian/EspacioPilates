<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Panel — Espacio Pilates</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main class="admin">

    <!-- Login -->
    <section id="login" class="admin-card">
        <h1>Panel del estudio</h1>
        <p class="admin-sub">Ingresá con tu cuenta de administrador.</p>

        <form id="login-form">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="username" required>

            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" autocomplete="current-password" required>

            <p class="admin-error" id="login-error" role="alert"></p>
            <button type="submit">Ingresar</button>
        </form>
    </section>

        <!-- Panel (se muestra solo con la sesión iniciada) -->
    <section id="panel" class="admin-card" hidden>
        <div class="admin-top">
            <h1>Reservas</h1>
            <button type="button" id="btn-salir" class="btn-secundario">Cerrar sesión</button>
        </div>
        <p class="admin-sub" id="panel-usuario"></p>
        <div class="panel-filtros">
            <label for="panel-fecha">Día</label>
            <input type="date" id="panel-fecha">
        </div>
        <div id="panel-contenido"></div>

        <details class="panel-bloqueos panel-horarios">
            <summary>Horarios</summary>
            <p class="admin-sub">Los turnos fijos de cada semana. Los cambios se ven al instante en la agenda.</p>

            <form id="turno-form" class="bloqueo-form">
                <div class="bloqueo-campo">
                    <label for="turno-dia">Día</label>
                    <select id="turno-dia" required>
                        <option value="Lunes">Lunes</option>
                        <option value="Martes">Martes</option>
                        <option value="Miércoles">Miércoles</option>
                        <option value="Jueves">Jueves</option>
                        <option value="Viernes">Viernes</option>
                        <option value="Sábado">Sábado</option>
                        <option value="Domingo">Domingo</option>
                    </select>
                </div>
                <div class="bloqueo-campo">
                    <label for="turno-hora">Hora</label>
                    <input type="time" id="turno-hora" required>
                </div>
                <div class="bloqueo-campo">
                    <label for="turno-cupo">Cupo</label>
                    <input type="number" id="turno-cupo" min="1" max="50" value="8" required>
                </div>
                <button type="submit">Agregar turno</button>
            </form>

            <div id="horarios-lista"></div>
        </details>

        <details class="panel-bloqueos">
            <summary>Días sin clases</summary>
            <p class="admin-sub">Los días bloqueados no aparecen en la agenda para reservar.</p>

            <form id="bloqueo-form" class="bloqueo-form">
                <div class="bloqueo-campo">
                    <label for="bloqueo-fecha">Fecha</label>
                    <input type="date" id="bloqueo-fecha" required>
                </div>
                <div class="bloqueo-campo">
                    <label for="bloqueo-motivo">Motivo (opcional)</label>
                    <input type="text" id="bloqueo-motivo" maxlength="60" placeholder="Ej: Feriado">
                </div>
                <button type="submit">Bloquear día</button>
            </form>

            <ul id="bloqueos-lista" class="bloqueos-lista"></ul>
        </details>
    </section>

    

</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
