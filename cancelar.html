<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Cancelar reserva | Espacio Pilates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <style>
    .cancelar-pagina {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
    }
    .cancelar-marca {
      font-family: 'Piazzolla', serif;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--bone-light);
      text-decoration: none;
    }
    .cancelar-caja {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(145deg, var(--rust), var(--ink-soft));
      border-radius: 8px;
      padding: 2.5rem;
      color: var(--bone-light);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }
    .cancelar-caja h1 {
      font-family: 'Piazzolla', serif;
      font-weight: 500;
      font-size: 1.6rem;
      margin: 0 0 1rem;
    }
    .cancelar-caja p {
      color: var(--bone);
      line-height: 1.6;
      margin: 0 0 1rem;
    }
    .cancelar-datos {
      margin: 1.25rem 0 1.5rem;
      padding: 1rem 1.2rem;
      background: rgba(246, 242, 232, 0.06);
      border: 1px solid rgba(246, 242, 232, 0.18);
      border-radius: 4px;
    }
    .cancelar-datos strong {
      display: block;
      font-family: 'Piazzolla', serif;
      font-weight: 500;
      font-size: 1.25rem;
      margin-bottom: 0.2rem;
    }
    .cancelar-datos strong::first-letter {
      text-transform: uppercase; /* "sábado" → "Sábado" */
    }
    .cancelar-nota {
      font-size: 0.9rem;
      color: rgba(246, 242, 232, 0.7) !important;
    }
    .cancelar-boton {
      display: block;
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 3px;
      background: var(--rust-dark);
      color: var(--bone-light);
      font-family: 'Archivo', sans-serif;
      font-size: 0.98rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .cancelar-boton:hover {
      background: var(--ink);
      transform: translateY(-1px);
    }
    .cancelar-boton:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }
    .cancelar-boton-secundario {
      background: transparent;
      border: 1px solid rgba(246, 242, 232, 0.4);
      margin-top: 0.5rem;
    }
    .cancelar-boton-secundario:hover {
      background: rgba(246, 242, 232, 0.1);
    }
  </style>
</head>
<body>

 <div class="bg-fixed">
    <video autoplay muted loop playsinline>
      <source src="video/hero.mp4" type="video/mp4">
    </video>
  </div>

  <main class="cancelar-pagina">
    <a href="index.html" class="cancelar-marca">Espacio Pilates</a>

        <div class="cancelar-caja" id="caja">
      <p>Cargando tu reserva...</p>
    </div>
  </main>
  
      <script>
    const caja = document.getElementById("caja");
    const id = new URLSearchParams(location.search).get("id");

    // "2026-10-10" → "sábado, 10 de octubre"
    function fechaLarga(fecha) {
      return new Date(`${fecha}T12:00:00-03:00`).toLocaleDateString("es-UY", {
        weekday: "long",
        day: "numeric",
        month: "long",
        timeZone: "America/Montevideo",
      });
    }

    async function llamar(accion) {
      const res = await fetch("/.netlify/functions/cancelar-reserva", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, accion }),
      });
      const datos = await res.json().catch(() => ({}));
      return { ok: res.ok, datos };
    }

    // Arma la caja con un título, un texto y un botón para volver al inicio
    function mostrarMensaje(titulo, texto) {
      caja.innerHTML = "";
      const h1 = document.createElement("h1");
      h1.textContent = titulo;
      const p = document.createElement("p");
      p.textContent = texto;
      const volver = document.createElement("a");
      volver.href = "index.html";
      volver.className = "cancelar-boton cancelar-boton-secundario";
      volver.textContent = "Ir al inicio";
      caja.append(h1, p, volver);
    }

    function mensajeDeError(error) {
      if (error === "no-existe") {
        mostrarMensaje("Reserva no encontrada", "Esta reserva ya fue cancelada o el link no es correcto.");
      } else if (error === "fuera-de-plazo") {
        mostrarMensaje("Ya no se puede cancelar", "Falta muy poco para la clase. Escribinos por WhatsApp y lo vemos.");
      } else if (error === "link-invalido") {
        mostrarMensaje("Link inválido", "Revisá que hayas abierto el link completo.");
      } else {
        mostrarMensaje("Algo salió mal", "No pudimos procesar el pedido. Probá de nuevo en unos minutos.");
      }
    }

    function mostrarReserva(r) {
      caja.innerHTML = "";

      const h1 = document.createElement("h1");
      h1.textContent = "Cancelar reserva";

      const saludo = document.createElement("p");
      saludo.textContent = `Hola ${r.nombre}, esta es tu reserva:`;

      const datos = document.createElement("div");
      datos.className = "cancelar-datos";
      const dia = document.createElement("strong");
      dia.textContent = fechaLarga(r.fecha);
      const hora = document.createElement("span");
      hora.textContent = `a las ${r.hora}`;
      datos.append(dia, hora);

      caja.append(h1, saludo, datos);

      if (!r.cancelable) {
        const aviso = document.createElement("p");
        aviso.textContent = `Las reservas se pueden cancelar hasta ${r.horasMinimas} horas antes de la clase. Si no podés venir, escribinos por WhatsApp.`;
        caja.append(aviso);
        return;
      }

      const nota = document.createElement("p");
      nota.className = "cancelar-nota";
      nota.textContent = "Al cancelar, tu lugar queda libre para otra persona.";

      const boton = document.createElement("button");
      boton.className = "cancelar-boton";
      boton.textContent = "Cancelar mi reserva";
      boton.addEventListener("click", async () => {
        boton.disabled = true;
        boton.textContent = "Cancelando...";
        const { ok, datos } = await llamar("cancelar");
        if (ok) {
          mostrarMensaje("Reserva cancelada", "Listo, tu lugar quedó libre. ¡Te esperamos en otra clase!");
        } else {
          mensajeDeError(datos.error);
        }
      });

      caja.append(nota, boton);
    }

    async function iniciar() {
      if (!id) {
        mensajeDeError("link-invalido");
        return;
      }
      try {
        const { ok, datos } = await llamar("consultar");
        if (ok) mostrarReserva(datos);
        else mensajeDeError(datos.error);
      } catch {
        mensajeDeError("error-interno");
      }
    }

    iniciar();
  </script>
</body>
</html>
