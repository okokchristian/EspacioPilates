<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Cancelar reserva | Espacio Pilates</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cancelar-pagina {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: #f4efe9;
    }
    .cancelar-caja {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      color: #3b332d;
    }
    .cancelar-caja h1 {
      font-size: 1.6rem;
      margin: 0 0 16px;
    }
    .cancelar-caja p {
      margin: 0 0 12px;
      line-height: 1.5;
    }
    .cancelar-datos {
      margin: 16px 0 24px;
      padding: 16px;
      background: #f4efe9;
      border-radius: 8px;
    }
    .cancelar-datos strong {
      display: block;
      font-size: 1.1rem;
    }
    .cancelar-nota {
      color: #6b5f57;
      font-size: 0.9rem;
    }
    .cancelar-boton {
      display: inline-block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #7a3e2b;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .cancelar-boton:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .cancelar-boton-secundario {
      background: transparent;
      color: #7a3e2b;
      border: 1px solid #7a3e2b;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main class="cancelar-pagina">
    <div class="cancelar-caja" id="caja">
      <p>Cargando tu reserva...</p>
    </div>
  </main>

  <script>
    const caja = document.getElementById("caja");
    const id = new URLSearchParams(location.search).get("id");

    // "2026-10-10" → "sábado, 10 de octubre"
    function fechaLarga(fecha) {
      return new Date(`${fecha}T12:00:00-03:00`).toLocaleDateString("es-UY", {
        weekday: "long",
        day: "numeric",
        month: "long",
        timeZone: "America/Montevideo",
      });
    }

    async function llamar(accion) {
      const res = await fetch("/.netlify/functions/cancelar-reserva", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, accion }),
      });
      const datos = await res.json().catch(() => ({}));
      return { ok: res.ok, datos };
    }

    // Arma la caja con un título, un texto y (opcional) un botón para volver
    function mostrarMensaje(titulo, texto) {
      caja.innerHTML = "";
      const h1 = document.createElement("h1");
      h1.textContent = titulo;
      const p = document.createElement("p");
      p.textContent = texto;
      const volver = document.createElement("a");
      volver.href = "index.html";
      volver.className = "cancelar-boton cancelar-boton-secundario";
      volver.textContent = "Ir al inicio";
      caja.append(h1, p, volver);
    }

    function mensajeDeError(error) {
      if (error === "no-existe") {
        mostrarMensaje("Reserva no encontrada", "Esta reserva ya fue cancelada o el link no es correcto.");
      } else if (error === "fuera-de-plazo") {
        mostrarMensaje("Ya no se puede cancelar", "Falta muy poco para la clase. Escribinos por WhatsApp y lo vemos.");
      } else if (error === "link-invalido") {
        mostrarMensaje("Link inválido", "Revisá que hayas abierto el link completo.");
      } else {
        mostrarMensaje("Algo salió mal", "No pudimos procesar el pedido. Probá de nuevo en unos minutos.");
      }
    }

    function mostrarReserva(r) {
      caja.innerHTML = "";

      const h1 = document.createElement("h1");
      h1.textContent = "Cancelar reserva";

      const saludo = document.createElement("p");
      saludo.textContent = `Hola ${r.nombre}, esta es tu reserva:`;

      const datos = document.createElement("div");
      datos.className = "cancelar-datos";
      const dia = document.createElement("strong");
      dia.textContent = fechaLarga(r.fecha);
      const hora = document.createElement("span");
      hora.textContent = `a las ${r.hora}`;
      datos.append(dia, hora);

      caja.append(h1, saludo, datos);

      if (!r.cancelable) {
        const aviso = document.createElement("p");
        aviso.textContent = `Las reservas se pueden cancelar hasta ${r.horasMinimas} horas antes de la clase. Si no podés venir, escribinos por WhatsApp.`;
        caja.append(aviso);
        return;
      }

      const nota = document.createElement("p");
      nota.className = "cancelar-nota";
      nota.textContent = "Al cancelar, tu lugar queda libre para otra persona.";

      const boton = document.createElement("button");
      boton.className = "cancelar-boton";
      boton.textContent = "Cancelar mi reserva";
      boton.addEventListener("click", async () => {
        boton.disabled = true;
        boton.textContent = "Cancelando...";
        const { ok, datos } = await llamar("cancelar");
        if (ok) {
          mostrarMensaje("Reserva cancelada", "Listo, tu lugar quedó libre. ¡Te esperamos en otra clase!");
        } else {
          mensajeDeError(datos.error);
        }
      });

      caja.append(nota, boton);
    }

    async function iniciar() {
      if (!id) {
        mensajeDeError("link-invalido");
        return;
      }
      try {
        const { ok, datos } = await llamar("consultar");
        if (ok) mostrarReserva(datos);
        else mensajeDeError(datos.error);
      } catch {
        mensajeDeError("error-interno");
      }
    }

    iniciar();
  </script>
</body>
</html>
