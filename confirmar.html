<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Confirmar reserva | Espacio Pilates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    .cancelar-pagina {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
    }
    .cancelar-marca {
      font-family: 'Piazzolla', serif;
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--bone-light);
      text-decoration: none;
    }
    .cancelar-caja {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(145deg, var(--rust), var(--ink-soft));
      border-radius: 8px;
      padding: 2.5rem;
      color: var(--bone-light);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }
    .cancelar-caja h1 {
      font-family: 'Piazzolla', serif;
      font-weight: 500;
      font-size: 1.6rem;
      margin: 0 0 1rem;
    }
    .cancelar-caja p {
      color: var(--bone);
      line-height: 1.6;
      margin: 0 0 1rem;
    }
    .cancelar-datos {
      margin: 1.25rem 0 1.5rem;
      padding: 1rem 1.2rem;
      background: rgba(246, 242, 232, 0.06);
      border: 1px solid rgba(246, 242, 232, 0.18);
      border-radius: 4px;
    }
    .cancelar-datos strong {
      display: block;
      font-family: 'Piazzolla', serif;
      font-weight: 500;
      font-size: 1.25rem;
      margin-bottom: 0.2rem;
    }
    .cancelar-datos strong::first-letter {
      text-transform: uppercase; /* "sábado" → "Sábado" */
    }
    .cancelar-nota {
      font-size: 0.9rem;
      color: rgba(246, 242, 232, 0.7) !important;
    }
    .cancelar-boton {
      display: block;
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 3px;
      background: var(--rust-dark);
      color: var(--bone-light);
      font-family: 'Archivo', sans-serif;
      font-size: 0.98rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .cancelar-boton:hover {
      background: var(--ink);
      transform: translateY(-1px);
    }
    .cancelar-boton:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }
    .cancelar-boton-secundario {
      background: transparent;
      border: 1px solid rgba(246, 242, 232, 0.4);
      margin-top: 0.5rem;
    }
    .cancelar-boton-secundario:hover {
      background: rgba(246, 242, 232, 0.1);
    }
  </style>
</head>
<body>

  <div class="bg-fixed">
    <video autoplay muted loop playsinline>
      <source src="video/hero.mp4" type="video/mp4">
    </video>
  </div>

  <main class="cancelar-pagina">
    <a href="index.html" class="cancelar-marca">Espacio Pilates</a>

    <div class="cancelar-caja" id="caja">
      <h1>Confirmá tu reserva</h1>
      <p>Tocá el botón para guardar tu lugar en la clase.</p>
      <p class="cancelar-nota">Hasta que no la confirmes, el lugar sigue libre para otras personas.</p>
      <button class="cancelar-boton" id="btn-confirmar" type="button">Confirmar mi reserva</button>
    </div>
  </main>

  <script>
    const caja = document.getElementById("caja");
    const botonConfirmar = document.getElementById("btn-confirmar");
    const token = new URLSearchParams(location.search).get("token");

    // Arma la caja con un título, un texto y un botón para volver al inicio
    function mostrarMensaje(titulo, texto) {
      caja.innerHTML = "";
      const h1 = document.createElement("h1");
      h1.textContent = titulo;
      const p = document.createElement("p");
      p.textContent = texto;
      const volver = document.createElement("a");
      volver.href = "index.html";
      volver.className = "cancelar-boton cancelar-boton-secundario";
      volver.textContent = "Ir al inicio";
      caja.append(h1, p, volver);
    }

    function mensajeDeError(error) {
      const mensajes = {
        "link-invalido": ["Link no válido", "Este link no es válido o la reserva ya no existe. Podés hacer una reserva nueva desde la web."],
        "vencido": ["El link venció", "Pasaron más de 30 minutos y el lugar se liberó. Podés hacer una reserva nueva desde la web."],
        "sin-lugar": ["La clase se llenó", "Mientras confirmabas, otra persona ocupó el último lugar. Elegí otro horario desde la web."],
        "dia-bloqueado": ["Ese día no hay clases", "El estudio cerró ese día. Elegí otro día desde la web."],
        "turno-pasado": ["La clase ya empezó", "Ese horario ya pasó. Elegí otro desde la web."],
        "turno-no-existe": ["Ese horario ya no existe", "El estudio cambió sus horarios. Elegí otro desde la web."],
        "ya-reservaste-ese-dia": ["Ya tenés una reserva ese día", "Solo se puede reservar una clase por día."],
      };
      const [titulo, texto] = mensajes[error] || ["Algo salió mal", "No pudimos confirmar la reserva. Probá de nuevo en unos minutos."];
      mostrarMensaje(titulo, texto);
    }

    function mostrarConfirmada(r) {
      caja.innerHTML = "";

      const h1 = document.createElement("h1");
      h1.textContent = "¡Tu clase está reservada!";

      const saludo = document.createElement("p");
      saludo.textContent = `Listo ${r.nombre}, te esperamos:`;

      const datos = document.createElement("div");
      datos.className = "cancelar-datos";
      const dia = document.createElement("strong");
      dia.textContent = r.fecha; // ya viene como "sábado, 10 de octubre"
      const hora = document.createElement("span");
      hora.textContent = `a las ${r.hora}`;
      datos.append(dia, hora);

      const nota = document.createElement("p");
      nota.className = "cancelar-nota";
      nota.textContent = "Te mandamos un mail con los datos de la clase y el link para cancelar si no podés venir.";

      const volver = document.createElement("a");
      volver.href = "index.html";
      volver.className = "cancelar-boton cancelar-boton-secundario";
      volver.textContent = "Ir al inicio";

      caja.append(h1, saludo, datos, nota, volver);
    }

    if (!token) {
      mensajeDeError("link-invalido");
    } else {
      botonConfirmar.addEventListener("click", async () => {
        botonConfirmar.disabled = true;
        botonConfirmar.textContent = "Confirmando...";

        try {
          const res = await fetch("/.netlify/functions/verificar-reserva", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token }),
          });
          const datos = await res.json().catch(() => ({}));

          if (res.ok && datos.ok) {
            mostrarConfirmada(datos);
          } else {
            mensajeDeError(datos.error);
          }
        } catch {
          mensajeDeError("error-interno");
        }
      });
    }
  </script>
</body>
</html>
